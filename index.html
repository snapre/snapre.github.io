<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="王子安，Srome 创始人 & CTO、AI Native Builder、deploy.bar 作者。"
    />
    <meta property="og:title" content="王子安 - Yellow Page" />
    <meta
      property="og:description"
      content="Srome 创始人 & CTO · AI Native Builder · deploy.bar 作者"
    />
    <meta property="og:image" content="./assets/profile/avatar.png" />
    <title>王子安 - Yellow Page</title>
    <link rel="icon" type="image/png" href="./assets/profile/avatar.png" />
    <link rel="apple-touch-icon" href="./assets/profile/avatar.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="namecard">
      <div class="blur-holder" aria-hidden="true">
        <img class="blur-image" src="./assets/profile/avatar.png" alt="" />
      </div>

      <div class="contents">
        <div class="content-main">
          <div class="hero-row">
            <section class="basic-info" aria-label="个人资料">
              <div class="profile-head">
                <img
                  class="avatar"
                  src="./assets/profile/avatar.png"
                  alt="王子安的头像"
                  width="1254"
                  height="1254"
                />
                <div class="profile-copy">
                  <div class="screen-name">王子安</div>
                </div>
              </div>
              <div class="job">创业中</div>
            </section>

            <section class="intro" aria-label="个人简介">
              <div class="bio">
                <span>Srome 创始人 &amp; CTO</span><br />
                <span>AI Native Builder</span><br />
                <span>deploy.bar 作者</span>
              </div>
            </section>
          </div>

          <section class="right-section" aria-labelledby="social-title">
            <header class="section-title desktop" id="social-title">
              <div class="title-cn">社交媒体</div>
              <div class="title-en">SOCIAL MEDIA</div>
            </header>
            <nav class="vertical-wrapper" aria-label="社交媒体链接">
              <div class="social-list inner">
              <a class="social-item desktop" href="https://x.com/_snapre" target="_blank" rel="noreferrer" aria-label="X">
                <img src="./assets/profile/social-x.png" alt="X" />
              </a>
              <a
                class="social-item desktop"
                href="https://www.instagram.com/snapre.wx?igsi=MThhdzN6NnJ4cWljNg%3D%3D&amp;utm_source=qr"
                target="_blank"
                rel="noreferrer"
                aria-label="Instagram"
              >
                <img src="./assets/profile/social-instagram.png" alt="Instagram" />
              </a>
              <a class="social-item desktop" href="https://github.com/snapre" target="_blank" rel="noreferrer" aria-label="GitHub">
                <img src="./assets/profile/social-github.png" alt="GitHub" />
              </a>
              <a
                class="social-item desktop"
                href="https://m.okjike.com/users/c56f6ef9-abe1-439e-ba55-352e63e44169"
                target="_blank"
                rel="noreferrer"
                aria-label="即刻"
              >
                <img src="./assets/profile/social-jike.png" alt="即刻" />
              </a>
              <a class="social-item desktop" href="https://xhslink.cn/o/5tsI2onVNAF" target="_blank" rel="noreferrer" aria-label="小红书">
                <img src="./assets/profile/social-xiaohongshu.png" alt="小红书" />
              </a>
              <button
                class="social-item desktop"
                type="button"
                data-copy="易普 AI"
                data-message="已复制"
                aria-label="复制公众号名称 易普 AI"
              >
                <img src="./assets/profile/social-wechat-official.png" alt="微信公众号" />
              </button>
              <a class="social-item desktop" href="https://weibo.com/snapre" target="_blank" rel="noreferrer" aria-label="微博">
                <img src="./assets/profile/social-weibo.png" alt="微博" />
              </a>
              </div>
            </nav>
          </section>

          <section class="right-section" aria-labelledby="works-title">
            <header class="section-title desktop" id="works-title">
              <div class="title-cn">作品</div>
              <div class="title-en">MY WORKS</div>
            </header>
            <div class="vertical-wrapper">
              <div class="works-list inner">
                <a class="work-item desktop" href="https://srome.app" target="_blank" rel="noreferrer">
                  <span class="work-left">
                    <img class="work-image" src="./assets/profile/work-srome.png" alt="Srome" />
                  </span>
                  <span class="work-copy">
                    <span class="work-title">Srome</span>
                    <span class="work-desc">Srome 是一个由 AI 居民参与的私密社交网络。</span>
                  </span>
                </a>
                <a class="work-item desktop" href="https://deploy.bar" target="_blank" rel="noreferrer">
                  <span class="work-left">
                    <img class="work-image" src="./assets/profile/work-deploybar.png" alt="DeployBar" />
                  </span>
                  <span class="work-copy">
                    <span class="work-title">DeployBar</span>
                    <span class="work-desc">一款免费开源的 macOS 菜单栏部署监控工具。</span>
                  </span>
                </a>
                <a class="work-item desktop" href="https://g.snapre.fun" target="_blank" rel="noreferrer">
                  <span class="work-left">
                    <img class="work-image" src="./assets/profile/work-bobby-carrot.png" alt="bobby carrot" />
                  </span>
                  <span class="work-copy">
                    <span class="work-title">bobby carrot</span>
                    <span class="work-desc">一款游戏</span>
                  </span>
                </a>
              </div>
            </div>
          </section>

          <section class="contact-section" aria-labelledby="contact-title">
            <header class="section-title desktop" id="contact-title">
              <div class="title-cn">联系我</div>
              <div class="title-en">CONTACT ME</div>
            </header>
            <div class="avatar-list desktop">
              <a class="round-item" href="mailto:hello@snapre.fun" aria-label="发送电子邮件">
                <img src="./assets/profile/contact-email.png" alt="电子邮件" />
              </a>
              <button
                class="round-item"
                type="button"
                data-copy="snapre"
                data-message="已复制"
                aria-label="复制微信号 snapre"
              >
                <img src="./assets/profile/contact-wechat.png" alt="微信" />
              </button>
            </div>
          </section>
        </div>
      </div>
    </main>

    <div class="toast" id="toast" role="alert" aria-live="polite"></div>
    <script src="./script.js"></script>
  </body>
</html>
