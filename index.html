<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Model 3 · 21 天自驾环线</title>
    <link rel="icon" type="image/svg+xml" href="./assets/tesla-t-logo.svg" />
    <link rel="shortcut icon" href="./assets/tesla-t-logo.svg" />
    <link rel="apple-touch-icon" href="./assets/tesla-t-logo.svg" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="trip-shell">
      <section class="hero" aria-label="21 天自驾路线互动地图">
        <div class="hero__backdrop" aria-hidden="true"></div>
        <div class="hero__copy">
          <p class="kicker">7000+ KM · 21 DAYS · TESLA MODEL 3</p>
          <h1>七千公里，二十一天，一辆特斯拉。</h1>
          <p>
            从杭州出发，在中国地图上用轮胎画一个环。华东、华北、黄土高原、四川盆地、江南丘陵，最后回到杭州。
          </p>

          <div class="cockpit">
            <div class="stat">
              <span>站点</span>
              <strong id="cityCount">28</strong>
            </div>
            <div class="stat">
              <span>天数</span>
              <strong>21</strong>
            </div>
            <div class="stat">
              <span>里程</span>
              <strong>7000+</strong>
            </div>
            <div class="stat">
              <span>座驾</span>
              <strong>Model 3</strong>
            </div>
            <button class="drive-button" id="driveToggle" type="button" aria-pressed="true">
              <span class="drive-button__dot"></span>
              自动巡航
            </button>
            <button class="drive-button share-button" id="shareGenerate" type="button">
              生成分享图
            </button>
          </div>
        </div>

        <div class="map-stage">
          <div class="map-frame">
            <div id="routeMap" role="img" aria-label="以真实中国地图为底板的 21 天自驾路线"></div>
          </div>
        </div>

        <aside class="info-panel" id="infoPanel" aria-live="polite">
          <div class="panel-topline">
            <span id="panelIndex">01</span>
            <span id="panelTag">出发点</span>
          </div>
          <h2 id="panelCity">杭州</h2>
          <div class="panel-meta" id="panelMeta"></div>
          <p id="panelEgg">西湖边按下出发，红色车漆映着清晨的湖光。</p>
          <div class="panel-grid">
            <div>
              <h3>看见</h3>
              <ul id="panelSights"></ul>
            </div>
            <div>
              <h3>吃过</h3>
              <ul id="panelFoods"></ul>
            </div>
          </div>
        </aside>
      </section>

      <section class="timeline" aria-label="路线站点时间线">
        <div class="section-heading">
          <p class="kicker">TAP THE STOPS</p>
          <h2>每座城市都藏了一个路上的瞬间</h2>
        </div>
        <div class="timeline-strip" id="timelineStrip"></div>
      </section>
    </main>

    <div class="share-modal" id="shareModal" aria-hidden="true" role="dialog" aria-label="自驾旅行分享图">
      <div class="share-modal__backdrop" data-share-close></div>
      <div class="share-modal__panel">
        <div class="share-modal__top">
          <div>
            <p class="kicker">ROADTRIP POSTER</p>
            <h2>你的七千公里分享图</h2>
          </div>
          <button class="share-modal__close" type="button" data-share-close aria-label="关闭分享图">×</button>
        </div>
        <div class="share-modal__preview">
          <img id="sharePreview" alt="本次自驾路线分享图预览" />
        </div>
        <div class="share-modal__actions">
          <button class="drive-button" id="shareDownload" type="button">保存到本地</button>
          <button class="drive-button" id="shareRegenerate" type="button">重新生成</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
